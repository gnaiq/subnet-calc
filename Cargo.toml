[package]
name = "subnet-calc"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "subnet-calc"
path = "src/main.rs"
icon = "assets/icon.png"

[dependencies]
eframe = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.14"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
